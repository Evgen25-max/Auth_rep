server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    listen       8000 default_server;
    listen       [::]:8000 default_server;
    server_name  _; 
    server_tokens off; 
    client_max_body_size 100M;

    location /static/ {
        alias /var/www/static/;
        expires 10d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location /media/ {
        alias /var/www/media/;
        location ~* \.(php|php[0-9]|phtml|pl|py|pyc|cgi|sh|bash|asp|aspx|exe|dll|jsp|rb|swf)$ {
            return 403;
        }
        location ~ /\. {
            return 404;
        }

	location ~* ^/media/(.+\.(svg|svgz|html|htm|xhtml|xml))$ {
	    alias /var/www/media/$1;
	    add_header Content-Disposition "attachment" always;
	    add_header X-Content-Type-Options "nosniff" always;
	    expires 7d;
	}

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    location /admin {
        include /etc/nginx/conf.d/uwsgi_backend.inc;
    }

    location /api {
	include /etc/nginx/conf.d/fastapi.inc;
	proxy_pass http://fastapi_backend;
    }
    
    location @backend {
        include /etc/nginx/conf.d/uwsgi_backend.inc;
    }
    
    location / {
        try_files $uri @backend;
    }

    error_page  404              /404.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
