services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
    volumes:
      - ./db/init_auth_schema.sql:/docker-entrypoint-initdb.d/01_init_auth_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUTH_USER:-auth_admin} -d ${POSTGRES_AUTH_DB:-auth_service_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - auth_test_net

  auth-redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --port 6379
      --requirepass ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      --maxmemory 128mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH_PASSW:-test-auth-redis-pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_test_net

  auth-service:
    build:
      context: ../../auth-service
    environment:
      PROJECT_NAME: auth-test

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      POSTGRES_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

      POSTGRES_AUTH_APP_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      POSTGRES_AUTH_APP_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}

      POSTGRES_ECHO: "false"

      # === ИСПРАВЛЕНО: Имена переменных теперь точно совпадают с core/config.py ===
      REDIS_AUTH_HOST: auth-redis
      REDIS_AUTH_PORT: 6379
      REDIS_AUTH_PASSW: ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      REDIS_AUTH_DB: 1
      REDIS_CONNECT_TIMEOUT: 5
      REDIS_SOCKET_TIMEOUT: 5
      # ============================================================================

      JWT_SECRET_KEY: test-jwt-secret-key-for-functional-tests
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      PERMS_CACHE_TTL_SECONDS: 60

      PASSWORD_PEPPER: test-password-pepper-for-functional-tests

    depends_on:
      postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8001)); s.close()\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - auth_test_net

  tests:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SERVICE_URL: http://auth-service:8001

      # Настройки БД (должны совпадать с test_settings в conftest.py)
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: ${POSTGRES_AUTH_USER:-auth_admin}
      TEST_POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-secret}
      TEST_POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_service_db}
      TEST_AUTH_SCHEMA: ${POSTGRES_AUTH_SCHEMA:-auth}

      # Настройки Redis (имена должны совпадать с conftest.py, но значения вести на auth-redis)
      TEST_REDIS_HOST: auth-redis
      TEST_REDIS_PORT: 6379
      TEST_REDIS_PASSW: ${REDIS_AUTH_PASSW:-test-auth-redis-pass}
      TEST_REDIS_DB: 1

      PASSWORD_PEPPER: test-password-pepper-for-functional-tests

    depends_on:
      auth-service:
        condition: service_healthy

    networks:
      - auth_test_net

    entrypoint: >
      sh -c "
        echo 'Running auth functional tests...' &&
        pytest src -v
      "

networks:
  auth_test_net:
    driver: bridge