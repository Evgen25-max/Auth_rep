
services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    env_file:
      - ../../.env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test_net

  redis:
    image: redis:7-alpine
    env_file:
      - ../../.env
    command: >
      redis-server
      --requirepass ${REDIS_PASSW}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSW}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test_net

  fastapi:
    build: 
      context: ../../fastapi
    env_file:
      - ../../.env
    environment:
      - ELASTIC_SCHEMA=http://
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSW=${REDIS_PASSW}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8001)); s.close()\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test_net

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      - ELASTIC_SCHEMA=http://
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSW=${REDIS_PASSW}
      - SERVICE_URL=http://fastapi:8001
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - test_net
    entrypoint: >
      sh -c "
        echo 'Waiting for Elasticsearch...' &&
        python3 utils/wait_for_es.py &&
        echo 'Waiting for Redis...' &&
        python3 utils/wait_for_redis.py &&
        echo 'Running pytest...' &&
        pytest src -v
      "

networks:
  test_net:
    driver: bridge
