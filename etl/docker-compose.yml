services:

  service:
    build: app
    expose:
      - "8000"
    env_file:
      - ./.env
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media
    depends_on:
      theatre-db:
        condition: service_healthy
    restart: unless-stopped


  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - service
    ports:
      - "80:80"
      - "8000:8000"
    restart: unless-stopped


  theatre-db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5


  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elastic
    depends_on:
      elasticsearch:
        condition: service_healthy

  etl:
    build: ./etl
    env_file:
      - ./.env
    volumes:
      - etl_logs:/opt/app/log
      - etl_state:/opt/app/state
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: unless-stopped
   
  fastapi:
    build: ./fastapi
    image: fastapi-image
    env_file:
      - ./.env
    volumes:
      - fastapi_logs:/opt/app/log
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - elastic
    restart: always
    
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --port ${REDIS_PORT}
      --requirepass ${REDIS_PASSW}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSW}", "ping"]
      interval: 6s
      timeout: 5s
      retries: 5
    restart: always
    
volumes:
  postgres_data:
  static_data:
  media_data:
  esdata:
  etl_logs:
  etl_state:
  redis_data:
  fastapi_logs:

networks:
  elastic:
    driver: bridge
